<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teymur Huseynov | Snake Game</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      min-height: 100vh;
    }

    .game-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 34px 24px 64px;
    }

    .game-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 22px;
      text-align: center;
    }

    .score-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      color: var(--muted);
      font-weight: 700;
    }

    .top-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 10px auto 14px;
    }

    .instructions {
      margin: 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .score-pill {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 14px;
      background: var(--surface-solid);
    }

    #game {
      width: 100%;
      max-width: 400px;
      height: auto;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: #0b1228;
    }

    .game-btn {
      text-decoration: none;
      border-radius: 999px;
      padding: 10px 18px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.2;
      cursor: pointer;
      color: var(--text);
      background: var(--surface-solid);
    }

    .game-btn:hover {
      border-color: var(--accent);
    }

    #statusText {
      margin-top: 10px;
      min-height: 24px;
      color: #fca5a5;
      font-weight: 700;
    }

    @media (max-width: 700px) {
      .game-wrap {
        padding: 20px 12px 36px;
      }

      .game-panel {
        padding: 16px 12px;
        border-radius: 14px;
      }

      .game-panel h1 {
        margin-top: 0;
        margin-bottom: 8px;
        font-size: 1.5rem;
      }

      .game-panel > p {
        margin-bottom: 10px;
        font-size: 0.94rem;
      }

      .score-row {
        gap: 8px;
        margin-bottom: 10px;
      }

      .score-pill {
        padding: 6px 10px;
        font-size: 0.88rem;
      }

      .top-controls {
        flex-direction: column;
        gap: 8px;
        margin-top: 4px;
      }

      .game-btn {
        width: 100%;
        max-width: 300px;
        padding: 10px 14px;
        font-size: 0.95rem;
      }

      .instructions {
        text-align: center;
        font-size: 0.88rem;
      }

      #game {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
    <a class="active" href="snake.html">Game</a>
    <button id="themeToggle" class="theme-toggle" type="button">Light Mode</button>
  </nav>

  <main class="game-wrap">
    <section class="game-panel">
      <h1>Snake Game</h1>
      <p>Use arrow keys to move. Eat food, avoid walls and yourself.</p>

      <div class="score-row">
        <span class="score-pill">Score: <span id="scoreValue">0</span></span>
        <span class="score-pill">High Score: <span id="highScoreValue">0</span></span>
      </div>

      <div class="top-controls">
        <button id="restartBtn" class="game-btn" type="button">Restart Game</button>
        <p class="instructions">Use arrow keys to move. Press <strong>Space</strong> to restart after game over.</p>
      </div>

      <canvas id="game" width="400" height="400"></canvas>

      <p id="statusText"></p>
    </section>
  </main>

  <script src="script.js"></script>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreValue = document.getElementById("scoreValue");
    const highScoreValue = document.getElementById("highScoreValue");
    const restartBtn = document.getElementById("restartBtn");
    const statusText = document.getElementById("statusText");

    const box = 20;
    const gridSize = 20;
    const speedMs = 100;
    const highScoreKey = "snakeHighScore";

    let snake = [];
    let direction = "RIGHT";
    let food = { x: 0, y: 0 };
    let score = 0;
    let highScore = Number(localStorage.getItem(highScoreKey)) || 0;
    let gameInterval = null;
    let isGameOver = false;

    highScoreValue.textContent = String(highScore);

    function spawnFood() {
      let valid = false;
      let newFood = { x: 0, y: 0 };

      while (!valid) {
        newFood = {
          x: Math.floor(Math.random() * gridSize) * box,
          y: Math.floor(Math.random() * gridSize) * box
        };
        valid = !snake.some((segment) => segment.x === newFood.x && segment.y === newFood.y);
      }
      return newFood;
    }

    function drawBoard() {
      ctx.fillStyle = "#0b1228";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(125, 211, 252, 0.07)";
      for (let i = 0; i <= canvas.width; i += box) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }
    }

    function drawFood() {
      ctx.fillStyle = "#f43f5e";
      ctx.fillRect(food.x + 2, food.y + 2, box - 4, box - 4);
    }

    function drawSnake() {
      snake.forEach((segment, i) => {
        ctx.fillStyle = i === 0 ? "#38bdf8" : "#22c55e";
        ctx.fillRect(segment.x + 1, segment.y + 1, box - 2, box - 2);
      });
    }

    function updateScore() {
      scoreValue.textContent = String(score);
      if (score > highScore) {
        highScore = score;
        localStorage.setItem(highScoreKey, String(highScore));
        highScoreValue.textContent = String(highScore);
      }
    }

    function step() {
      if (isGameOver) return;

      const head = { ...snake[0] };
      if (direction === "LEFT") head.x -= box;
      if (direction === "RIGHT") head.x += box;
      if (direction === "UP") head.y -= box;
      if (direction === "DOWN") head.y += box;

      const hitWall =
        head.x < 0 ||
        head.y < 0 ||
        head.x >= canvas.width ||
        head.y >= canvas.height;

      const hitSelf = snake.some((segment) => segment.x === head.x && segment.y === head.y);

      if (hitWall || hitSelf) {
        isGameOver = true;
        clearInterval(gameInterval);
        statusText.textContent = "Game over! Press Restart or Space to play again.";
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 1;
        updateScore();
        food = spawnFood();
      } else {
        snake.pop();
      }

      drawBoard();
      drawFood();
      drawSnake();
    }

    function restartGame() {
      snake = [{ x: 9 * box, y: 9 * box }];
      direction = "RIGHT";
      score = 0;
      isGameOver = false;
      statusText.textContent = "";
      updateScore();
      food = spawnFood();

      drawBoard();
      drawFood();
      drawSnake();

      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(step, speedMs);
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" && direction !== "RIGHT") direction = "LEFT";
      if (e.key === "ArrowRight" && direction !== "LEFT") direction = "RIGHT";
      if (e.key === "ArrowUp" && direction !== "DOWN") direction = "UP";
      if (e.key === "ArrowDown" && direction !== "UP") direction = "DOWN";
      if (e.code === "Space" && isGameOver) restartGame();
    });

    restartBtn.addEventListener("click", restartGame);
    restartGame();
  </script>
</body>
</html>
